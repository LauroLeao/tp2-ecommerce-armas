quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/armasdb
quarkus.datasource.username=armas_user
quarkus.datasource.password=123456
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.limits.max-body-size=8M

%dev.quarkus.datasource.dev-ui.allow-sql=true

# Os testes usam um banco temporario e nao dependem do PostgreSQL local.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:armasdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=no-file
